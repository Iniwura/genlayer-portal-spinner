<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GenLayer Portal Spinner</title>
  <link rel="stylesheet" href="spinner.css" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #d8d8d8;
      color: #111;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .shell {
      width: min(900px, 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -.02em;
    }

    .intro {
      margin: 0 0 22px;
      color: #666;
      font-size: 14px;
    }

    .preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid rgba(0,0,0,.16);
      overflow: hidden;
    }

    .panel {
      min-height: 320px;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .light {
      background: #fff;
      color: #000;
    }

    .dark {
      background: #090909;
      color: #fff;
    }

    .sizes {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .s16 { width: 16px; height: 16px; }
    .s24 { width: 24px; height: 24px; }
    .s32 { width: 32px; height: 32px; }
    .s48 { width: 48px; height: 48px; }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #666;
    }

    @media (max-width: 680px) {
      .preview { grid-template-columns: 1fr; }
      .panel { min-height: 240px; }
    }
  </style>
</head>
<body>
